spring:
  application:
    name: dam
  # 로컬 비밀값은 .env 하나에 둔다. 인텔리제이 실행 설정과 터미널이 같은 파일을
  # 보게 되어, 한쪽에만 넣어 두고 다른 쪽에서 헤매는 일이 없어진다.
  # optional 이라 파일이 없는 곳(CI, 운영)에서는 그냥 환경변수를 쓴다.
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dam?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health

dam:
  client:
    # 이 버전보다 낮은 앱은 받지 않는다. 앱을 새로 내지 않고 이 값만 올리면 강제된다.
    min-version: ${MIN_APP_VERSION:1.0.0}

  session:
    # 로컬 기본값은 개발 편의용이다. 운영에서는 반드시 환경변수로 덮는다.
    secret: ${SESSION_SECRET:dam-local-development-secret-key-please-override-me}
    ttl: 30d
  apple:
    bundle-id: ${APPLE_BUNDLE_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
  storage:
    bucket: ${STORAGE_BUCKET:dam}
    region: ${STORAGE_REGION:ap-tokyo-1}
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    upload-ttl: 5m
    read-ttl: 6d
    max-bytes: 10485760

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    org.hibernate.SQL: debug
