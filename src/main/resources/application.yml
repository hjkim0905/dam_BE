spring:
  application:
    name: dam
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dam?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health

dam:
  session:
    # 로컬 기본값은 개발 편의용이다. 운영에서는 반드시 환경변수로 덮는다.
    secret: ${SESSION_SECRET:dam-local-development-secret-key-please-override-me}
    ttl: 30d
  apple:
    bundle-id: ${APPLE_BUNDLE_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
  storage:
    bucket: ${STORAGE_BUCKET:dam}
    region: ${STORAGE_REGION:ap-chuncheon-1}
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    upload-ttl: 5m
    read-ttl: 15m
    max-bytes: 10485760

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    org.hibernate.SQL: debug
